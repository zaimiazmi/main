<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Website Closed</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(10, 15, 35, 0.82);
      --text: #f5f7fb;
      --muted: #b8c0d9;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Poppins, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(167, 139, 250, 0.28), transparent 32%),
        radial-gradient(circle at bottom right, rgba(125, 211, 252, 0.18), transparent 28%),
        linear-gradient(160deg, #050816 0%, var(--bg) 55%, #060913 100%);
      padding: 24px;
    }

    .closed-container {
      width: min(640px, 100%);
      padding: 40px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(14px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(125, 211, 252, 0.12);
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .contact {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .contact-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      color: #08111f;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .contact-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.32);
    }

    .footer-note {
      margin-top: 22px;
      font-size: 0.92rem;
      color: rgba(184, 192, 217, 0.72);
    }
  </style>
</head>
<body>
  <main class="closed-container">
    <div class="badge">Website Closed</div>
    <h1>We'll Be Back Soon</h1>
    <p>This website is currently closed for maintenance.<br>Please check back later.</p>
    <div class="contact">
      <a class="contact-cta" href="mailto:hello@zzaimii.com" aria-label="Email hello at zzaimii dot com">hello@zzaimii.com</a>
    </div>
    <div class="footer-note">Designed by ikanpaus2703</div>
  </main>
</body>
</html>
