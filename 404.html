<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page Not Found</title>
  <script>
    // List of valid pages that should NOT redirect
    const validPages = ['/', '/showcase', '/showcase/', '/projects', '/projects/', '/portfolio', '/portfolio/', '/cyberia', '/cyberia/', '/closed.html'];
    const currentPath = window.location.pathname;
    
    // Check if current path is a valid page
    const isValidPage = validPages.some(page => currentPath === page || currentPath === page + '/');
    
    // Only redirect to homepage if path is NOT a valid page
    if (!isValidPage) {
      // Try to load the page with .html extension if not found
      const tryHtmlPath = currentPath.endsWith('/') 
        ? currentPath.slice(0, -1) + '.html'
        : currentPath + '.html';
      
      // Check if HTML version exists by attempting to fetch
      fetch(tryHtmlPath, { method: 'HEAD' })
        .then(response => {
          if (response.ok) {
            window.location.replace(tryHtmlPath);
          } else {
            // If still not found, redirect to homepage
            window.location.replace('https://zzaimii.com');
          }
        })
        .catch(() => {
          // If fetch fails, redirect to homepage
          window.location.replace('https://zzaimii.com');
        });
    }
  </script>
</head>
<body>
  <p>Page not found. Redirecting...</p>
</body>
</html>
