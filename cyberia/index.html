<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Cyberia: Wira Siber – A 2D pixel adventure about online safety" />
  <title>Cyberia: Wira Siber – The Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Mono:wght@400;500;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0a0a;
      margin: 0;
      padding: 0;
      font-family: 'Roboto Mono', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #ccff00;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid #222;
      border-top-color: #ccff00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Navbar */
    .pillbar-out {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    .nav-bar {
      display: inline-flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(40,40,40,.85);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }
    .pill {
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all .2s ease;
    }
    .pill:hover { background: rgba(255,255,255,.2); }
    .pill.active { background: #ccff00; color: #0a0a0a; }

    @media (max-width: 768px) {
      .pillbar-out {
        bottom: 20px;
        top: auto;
      }
      .nav-bar {
        gap: 4px;
        padding: 6px 10px;
      }
      .pill {
        padding: 8px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading">
    <div class="spinner"></div>
    <span>Initialising System...</span>
  </div>

  <!-- Navbar -->
  <div class="pillbar-out">
    <nav class="nav-bar">
      <a class="pill" href="/">Home</a>
      <a class="pill" href="/showcase">Showcase</a>
      <a class="pill" href="/projects">Projects</a>
      <a class="pill" href="/portfolio">Portfolio</a>
    </nav>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="uiCanvas"></canvas>
  </div>

  <script>
    /**
     * CYBERIA UI - CANVAS RENDERER (Marathon Style)
     * Pixel-perfect rendering with HTML5 Canvas API
     */

    const canvas = document.getElementById('uiCanvas');
    const ctx = canvas.getContext('2d');
    const loadingEl = document.getElementById('loading');

    // --- CONFIGURATION ---
    const DESKTOP_WIDTH = 1000;
    const DESKTOP_HEIGHT = 600;
    const MOBILE_WIDTH = 400;
    const MOBILE_HEIGHT = 800;
    let WIDTH = DESKTOP_WIDTH;
    let HEIGHT = DESKTOP_HEIGHT;
    
    // Warna tema Cyberia
    const colors = {
      neon: '#ccff00',
      black: '#0a0a0a',
      panelBlack: '#050505',
      white: '#ffffff',
      gray: '#888888',
      overlay: 'rgba(0,0,0,0.35)',
      grid: 'rgba(255,255,255,0.15)'
    };

    // State untuk interaksi
    let mouseX = 0;
    let mouseY = 0;
    let isHoveringPreOrder = false;
    let isHoveringPlay = false;
    let scanlineY = 0;
    let isMobile = window.innerWidth <= 768;

    // --- ASSET MANAGEMENT ---
    let assetsLoaded = 0;
    const totalAssets = 2;

    const bgImage = new Image();
    bgImage.crossOrigin = "Anonymous";
    bgImage.src = 'cyberwise-thumb.jpg';
    
    bgImage.onload = () => checkLoad();
    bgImage.onerror = () => {
      console.warn("Image failed to load, using fallback");
      checkLoad();
    };

    document.fonts.ready.then(() => checkLoad());

    function checkLoad() {
      assetsLoaded++;
      if (assetsLoaded >= totalAssets) {
        setTimeout(() => {
          loadingEl.classList.add('hidden');
          setupCanvas();
          requestAnimationFrame(renderLoop);
        }, 500);
      }
    }

    // --- SETUP ---
    function setupCanvas() {
      resizeCanvas();
      window.addEventListener('resize', () => {
        isMobile = window.innerWidth <= 768;
        resizeCanvas();
      });

      // Mouse events
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = WIDTH / rect.width;
        const scaleY = HEIGHT / rect.height;
        mouseX = (e.clientX - rect.left) * scaleX;
        mouseY = (e.clientY - rect.top) * scaleY;
      });

      // Touch events for mobile
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = WIDTH / rect.width;
        const scaleY = HEIGHT / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
        
        // Check hit detection immediately for touch
        updateLogic();
        if (isHoveringPreOrder) {
          window.open('https://cyberwise.zzaimii.com', '_blank');
        }
        if (isHoveringPlay) {
          alert("🎬 Trailer coming soon!\n\nGet ready to embark on an epic cyber adventure!");
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = WIDTH / rect.width;
        const scaleY = HEIGHT / rect.height;
        mouseX = (touch.clientX - rect.left) * scaleX;
        mouseY = (touch.clientY - rect.top) * scaleY;
      }, { passive: false });

      canvas.addEventListener('click', () => {
        if (isHoveringPreOrder) {
          window.open('https://cyberwise.zzaimii.com', '_blank');
        }
        if (isHoveringPlay) {
          alert("🎬 Trailer coming soon!\n\nGet ready to embark on an epic cyber adventure!");
        }
      });
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const containerW = window.innerWidth;
      const containerH = window.innerHeight;
      
      // Switch canvas dimensions based on device
      WIDTH = isMobile ? MOBILE_WIDTH : DESKTOP_WIDTH;
      HEIGHT = isMobile ? MOBILE_HEIGHT : DESKTOP_HEIGHT;
      
      // Calculate scale to fill screen
      const scaleX = containerW / WIDTH;
      const scaleY = containerH / HEIGHT;
      const scale = Math.max(scaleX, scaleY);
      
      canvas.width = WIDTH * dpr;
      canvas.height = HEIGHT * dpr;
      canvas.style.width = `${WIDTH * scale}px`;
      canvas.style.height = `${HEIGHT * scale}px`;
      
      // Center the canvas
      canvas.style.position = 'absolute';
      canvas.style.left = `${(containerW - WIDTH * scale) / 2}px`;
      canvas.style.top = `${(containerH - HEIGHT * scale) / 2}px`;
      
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }

    // --- MAIN RENDER LOOP ---
    function renderLoop() {
      updateLogic();
      
      ctx.fillStyle = colors.black;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      if (isMobile) {
        drawMobileLayout();
      } else {
        drawLeftPanel();
        drawDivider();
        drawRightPanel();
      }
      drawScanlines();

      requestAnimationFrame(renderLoop);
    }

    function updateLogic() {
      scanlineY += 2;
      if (scanlineY > HEIGHT) scanlineY = 0;

      // Hit Detection - different positions for mobile vs desktop
      if (isMobile) {
        // Mobile: TRY NOW button at bottom
        if (mouseX >= 30 && mouseX <= WIDTH - 30 && mouseY >= 680 && mouseY <= 740) {
          isHoveringPreOrder = true;
          isHoveringPlay = false;
          canvas.style.cursor = 'pointer';
        } else if (mouseX >= 50 && mouseX <= WIDTH - 50 && mouseY >= 180 && mouseY <= 280) {
          // Mobile: PLAY TRAILER in hero area
          isHoveringPlay = true;
          isHoveringPreOrder = false;
          canvas.style.cursor = 'pointer';
        } else {
          isHoveringPreOrder = false;
          isHoveringPlay = false;
          canvas.style.cursor = 'default';
        }
      } else {
        // Desktop hit detection
        if (mouseX >= 880 && mouseX <= 970 && mouseY >= 30 && mouseY <= 60) {
          isHoveringPreOrder = true;
          isHoveringPlay = false;
          canvas.style.cursor = 'pointer';
        } else if (mouseX >= 520 && mouseX <= 890 && mouseY >= 260 && mouseY <= 340) {
          isHoveringPlay = true;
          isHoveringPreOrder = false;
          canvas.style.cursor = 'pointer';
        } else {
          isHoveringPreOrder = false;
          isHoveringPlay = false;
          canvas.style.cursor = 'default';
        }
      }
    }

    // --- DRAWING FUNCTIONS ---

    function drawMobileLayout() {
      // === HERO SECTION (Top half with image) ===
      const heroH = 320;
      
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, WIDTH, heroH);
      ctx.clip();

      // Draw background image
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        const imgRatio = bgImage.width / bgImage.height;
        const canvasRatio = WIDTH / heroH;
        let sx, sy, sWidth, sHeight;

        if (imgRatio > canvasRatio) {
          sHeight = bgImage.height;
          sWidth = bgImage.height * canvasRatio;
          sx = (bgImage.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = bgImage.width;
          sHeight = bgImage.width / canvasRatio;
          sx = 0;
          sy = (bgImage.height - sHeight) / 2;
        }
        ctx.drawImage(bgImage, sx, sy, sWidth, sHeight, 0, 0, WIDTH, heroH);
      } else {
        ctx.fillStyle = '#151515';
        ctx.fillRect(0, 0, WIDTH, heroH);
      }

      // Dark overlay
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0, 0, WIDTH, heroH);

      // PLAY TRAILER centered in hero
      const centerX = WIDTH / 2;
      const centerY = heroH / 2;
      
      ctx.textAlign = 'center';
      ctx.font = '700 36px "Oswald"';
      ctx.fillStyle = isHoveringPlay ? colors.white : colors.neon;
      
      if (isHoveringPlay) {
        ctx.shadowColor = 'rgba(255,255,255,0.5)';
        ctx.shadowBlur = 20;
      }
      ctx.fillText('PLAY TRAILER', centerX, centerY);
      ctx.shadowBlur = 0;

      // Brackets around PLAY TRAILER
      ctx.strokeStyle = isHoveringPlay ? colors.neon : colors.white;
      ctx.lineWidth = 2;
      const bracketH = 40;
      const bracketW = 15;
      const gap = 110;

      ctx.beginPath();
      ctx.moveTo(centerX - gap, centerY - bracketH/2);
      ctx.lineTo(centerX - gap - bracketW, centerY - bracketH/2);
      ctx.lineTo(centerX - gap - bracketW, centerY + bracketH/2);
      ctx.lineTo(centerX - gap, centerY + bracketH/2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(centerX + gap, centerY - bracketH/2);
      ctx.lineTo(centerX + gap + bracketW, centerY - bracketH/2);
      ctx.lineTo(centerX + gap + bracketW, centerY + bracketH/2);
      ctx.lineTo(centerX + gap, centerY + bracketH/2);
      ctx.stroke();

      ctx.restore();

      // === CONTENT SECTION (Bottom half - white background) ===
      ctx.fillStyle = colors.white;
      ctx.fillRect(0, heroH, WIDTH, HEIGHT - heroH);

      // Checkerboard accent
      drawCheckerPattern(0, heroH, WIDTH, 20);

      // LOGO
      ctx.fillStyle = colors.neon;
      ctx.font = 'bold 48px "Oswald"';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText('CYBERIA', 30, heroH + 40);

      // Subtitle
      ctx.fillStyle = colors.panelBlack;
      ctx.font = '500 12px "Roboto Mono"';
      ctx.fillText('from the creators', 30, heroH + 100);
      ctx.font = '700 16px "Roboto Mono"';
      ctx.fillText('of cyber-safety games', 30, heroH + 120);

      // Description
      ctx.fillStyle = '#333';
      ctx.font = '400 11px "Roboto Mono"';
      const lines = [
        "become a cyber hero in this pixel rpg.",
        "spot scams, fake accounts, and online",
        "dangers through exciting missions."
      ];
      lines.forEach((line, i) => {
        ctx.fillText(line, 30, heroH + 160 + (i * 18));
      });

      // Chips
      const chips = ['7+', 'RPG', 'TESTING'];
      let chipX = 30;
      ctx.font = '700 10px "Roboto Mono"';
      chips.forEach(chip => {
        const w = ctx.measureText(chip).width + 24;
        ctx.fillStyle = colors.panelBlack;
        ctx.fillRect(chipX, heroH + 230, w, 26);
        ctx.fillStyle = colors.neon;
        ctx.beginPath();
        ctx.arc(chipX + 12, heroH + 243, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = colors.white;
        ctx.textBaseline = 'middle';
        ctx.fillText(chip, chipX + 22, heroH + 243);
        chipX += w + 8;
      });

      // === TRY NOW BUTTON (Full width at bottom) ===
      ctx.fillStyle = isHoveringPreOrder ? colors.white : colors.neon;
      ctx.fillRect(30, 680, WIDTH - 60, 60);
      
      // Button border on hover
      if (isHoveringPreOrder) {
        ctx.strokeStyle = colors.neon;
        ctx.lineWidth = 3;
        ctx.strokeRect(30, 680, WIDTH - 60, 60);
      }
      
      ctx.fillStyle = colors.black;
      ctx.font = '700 18px "Roboto Mono"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('TRY NOW', WIDTH / 2, 710);

      // Bottom tagline bar
      ctx.fillStyle = colors.panelBlack;
      ctx.fillRect(0, 760, WIDTH, 40);
      ctx.fillStyle = colors.neon;
      ctx.font = '700 11px "Roboto Mono"';
      ctx.textAlign = 'center';
      ctx.fillText('ANY RUN CAN LEAD TO SAFETY', WIDTH / 2, 780);
    }

    function drawLeftPanel() {
      // Background Putih
      ctx.fillStyle = colors.white;
      ctx.fillRect(0, 0, 350, HEIGHT);

      // -- LOGO --
      ctx.fillStyle = colors.neon;
      ctx.font = 'bold 65px "Oswald"';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText('CYBERIA', 40, 50);

      // -- SUBTITLES --
      ctx.fillStyle = colors.panelBlack;
      ctx.font = '500 14px "Roboto Mono"';
      ctx.fillText('from the creators', 40, 140);
      
      ctx.font = '700 22px "Roboto Mono"';
      ctx.fillText('of cyber-safety games', 40, 165);

      // -- DESCRIPTION PARAGRAPH --
      ctx.fillStyle = '#333';
      ctx.font = '400 11px "Roboto Mono"';
      const lineHeight = 18;
      const startY = 220;
      const lines = [
        "become a cyber hero in this pixel",
        "rpg adventure. spot scams, fake",
        "accounts, and online dangers",
        "through exciting missions.",
        "defend friends, stay sharp, and",
        "learn the skills to win every run.",
        "",
        "any run can lead to safety."
      ];

      lines.forEach((line, index) => {
        if (index === lines.length - 1) {
          ctx.font = '700 11px "Roboto Mono"';
        } else {
          ctx.font = '400 11px "Roboto Mono"';
        }
        ctx.fillText(line, 40, startY + (index * lineHeight));
      });

      // -- CHIPS --
      const chips = ['7+', 'RPG', 'TESTING'];
      let chipX = 40;
      ctx.font = '700 10px "Roboto Mono"';
      chips.forEach(chip => {
        const w = ctx.measureText(chip).width + 24;
        ctx.fillStyle = colors.panelBlack;
        ctx.fillRect(chipX, 380, w, 26);
        // Neon dot
        ctx.fillStyle = colors.neon;
        ctx.beginPath();
        ctx.arc(chipX + 12, 393, 4, 0, Math.PI * 2);
        ctx.fill();
        // Text
        ctx.fillStyle = colors.white;
        ctx.textBaseline = 'middle';
        ctx.fillText(chip, chipX + 22, 393);
        chipX += w + 8;
      });

      // -- BOTTOM BARS --
      ctx.fillStyle = colors.panelBlack;
      ctx.fillRect(0, 480, 350, 40);
      ctx.fillStyle = colors.white;
      ctx.font = '700 13px "Roboto Mono"';
      ctx.textBaseline = 'middle';
      ctx.fillText('NOWHERE TO LEARN?', 40, 500);

      // Neon Bar with inverted text
      ctx.fillStyle = colors.neon;
      ctx.fillRect(0, 520, 350, 80);

      ctx.save();
      ctx.translate(0, HEIGHT);
      ctx.scale(1, -1);
      ctx.fillStyle = colors.panelBlack;
      ctx.font = '700 28px "Roboto Mono"';
      ctx.textBaseline = 'top';
      ctx.fillText('THEN PLAY', 40, 45);
      ctx.restore();
    }

    function drawDivider() {
      ctx.fillStyle = colors.panelBlack;
      ctx.fillRect(350, 0, 60, HEIGHT);
      
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(410, 0);
      ctx.lineTo(410, HEIGHT);
      ctx.stroke();

      // Checkerboard Patterns
      drawCheckerPattern(350, 40, 60, 60);
      drawCheckerPattern(350, 200, 60, 140);
      drawCheckerPattern(350, 500, 60, 60);
    }

    function drawCheckerPattern(x, y, w, h) {
      const cellSize = 10;
      ctx.fillStyle = 'rgba(255,255,255, 0.8)';
      
      for (let row = 0; row < h; row += cellSize) {
        for (let col = 0; col < w; col += cellSize) {
          if (((row/cellSize) + (col/cellSize)) % 2 === 0) {
            ctx.fillRect(x + col, y + row, cellSize, cellSize);
          }
        }
      }
    }

    function drawRightPanel() {
      const x = 410;
      const w = WIDTH - x;
      const h = HEIGHT;

      ctx.save();
      ctx.beginPath();
      ctx.rect(x, 0, w, h);
      ctx.clip();

      // Draw Image or fallback
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        const imgRatio = bgImage.width / bgImage.height;
        const canvasRatio = w / h;
        let sx, sy, sWidth, sHeight;

        if (imgRatio > canvasRatio) {
          sHeight = bgImage.height;
          sWidth = bgImage.height * canvasRatio;
          sx = (bgImage.width - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = bgImage.width;
          sHeight = bgImage.width / canvasRatio;
          sx = 0;
          sy = (bgImage.height - sHeight) / 2;
        }

        ctx.drawImage(bgImage, sx, sy, sWidth, sHeight, x, 0, w, h);
      } else {
        ctx.fillStyle = '#151515';
        ctx.fillRect(x, 0, w, h);
      }

      // Dark Overlay
      ctx.fillStyle = colors.overlay;
      ctx.fillRect(x, 0, w, h);

      // Grid Lines Decoration (Top Right)
      ctx.strokeStyle = colors.grid;
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + w - 120, 20);
      ctx.lineTo(x + w - 20, 20);
      ctx.lineTo(x + w - 20, 120);
      ctx.stroke();
      ctx.setLineDash([]);

      // Pre-Order Button
      ctx.fillStyle = isHoveringPreOrder ? colors.white : colors.neon;
      ctx.fillRect(880, 30, 90, 30);
      ctx.fillStyle = colors.black;
      ctx.font = '700 11px "Roboto Mono"';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';
      ctx.fillText('TRY NOW', 925, 45);

      // Play Trailer (Center)
      const centerX = x + (w / 2);
      const centerY = h / 2;

      ctx.textAlign = 'center';
      ctx.font = '700 48px "Oswald"';
      ctx.fillStyle = isHoveringPlay ? colors.white : colors.neon;
      
      // Text shadow
      if (isHoveringPlay) {
        ctx.shadowColor = 'rgba(255,255,255,0.5)';
        ctx.shadowBlur = 20;
      }
      ctx.fillText('PLAY TRAILER', centerX, centerY - 10);
      ctx.shadowBlur = 0;

      // Brackets
      ctx.strokeStyle = isHoveringPlay ? colors.neon : colors.white;
      ctx.lineWidth = 3;
      const bracketH = 60;
      const bracketW = 20;
      const gap = 160;

      // Left Bracket
      ctx.beginPath();
      ctx.moveTo(centerX - gap, centerY - bracketH/2);
      ctx.lineTo(centerX - gap - bracketW, centerY - bracketH/2);
      ctx.lineTo(centerX - gap - bracketW, centerY + bracketH/2);
      ctx.lineTo(centerX - gap, centerY + bracketH/2);
      ctx.stroke();

      // Right Bracket
      ctx.beginPath();
      ctx.moveTo(centerX + gap, centerY - bracketH/2);
      ctx.lineTo(centerX + gap + bracketW, centerY - bracketH/2);
      ctx.lineTo(centerX + gap + bracketW, centerY + bracketH/2);
      ctx.lineTo(centerX + gap, centerY + bracketH/2);
      ctx.stroke();

      // Info badge bottom right
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(x + w - 150, h - 50, 130, 30);
      ctx.strokeStyle = 'rgba(204,255,0,0.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + w - 150, h - 50, 130, 30);
      
      // Pulse dot
      ctx.fillStyle = colors.neon;
      ctx.beginPath();
      ctx.arc(x + w - 138, h - 35, 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = colors.white;
      ctx.font = '500 10px "Roboto Mono"';
      ctx.textAlign = 'left';
      ctx.fillText('PIXEL RPG • 2025', x + w - 128, h - 31);

      ctx.restore();
    }

    function drawScanlines() {
      // Moving scanline beam
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.fillRect(0, scanlineY, WIDTH, 5);

      // Static CRT lines
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      for(let i = 0; i < HEIGHT; i += 4) {
        ctx.fillRect(0, i, WIDTH, 1);
      }
    }

    // Trigger initial mobile check
    isMobile = window.innerWidth <= 768;
  </script>
</body>
</html>
